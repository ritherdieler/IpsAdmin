ext.loadLocalProperties = { Project project ->
    def props = new Properties()
    def file = project.rootProject.file("local.properties")
    if (file.exists()) {
        props.load(new FileInputStream(file))
    }
    return props
}

ext.propOrEnv = { Properties props, String key ->
    return (props.getProperty(key) ?: System.getenv(key) ?: "").replace('"', '')
}

ext.propOnly = { Properties props, String key ->
    return (props.getProperty(key) ?: "").replace('"', '')
}

ext.mapsApiKeyFromGoogleServices = { File jsonFile ->
    if (!jsonFile.exists()) {
        return ""
    }
    def json = new groovy.json.JsonSlurper().parse(jsonFile)
    def clients = json.client
    if (!(clients instanceof List) || clients.isEmpty()) {
        return ""
    }
    def keys = clients[0].api_key
    if (!(keys instanceof List) || keys.isEmpty()) {
        return ""
    }
    return (keys[0].current_key ?: "").toString().trim()
}

ext.resolveMapsApiKey = { Properties props, File googleServicesJson ->
    def explicit = propOrEnv(props, "MAPS_API_KEY").trim()
    if (!explicit.isEmpty()) {
        return explicit
    }
    return mapsApiKeyFromGoogleServices(googleServicesJson)
}

ext.resolveProdObsApiKey = { Properties props ->
    def androidKey = propOrEnv(props, "OBS_API_KEY_ANDROID")
    if (!androidKey.isEmpty()) {
        return androidKey
    }
    def legacyKey = propOrEnv(props, "OBS_API_KEY")
    if (!legacyKey.isEmpty()) {
        logger.warn(
            "OBS_API_KEY en local.properties esta deprecado para prod; " +
                "usa OBS_API_KEY_ANDROID (mismo valor que el backend en prod)."
        )
        return legacyKey
    }
    return ""
}
