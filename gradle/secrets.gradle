ext.loadLocalProperties = { Project project ->
    def props = new Properties()
    def file = project.rootProject.file("local.properties")
    if (file.exists()) {
        props.load(new FileInputStream(file))
    }
    return props
}

ext.propOrEnv = { Properties props, String key ->
    return (props.getProperty(key) ?: System.getenv(key) ?: "").replace('"', '')
}

ext.propOnly = { Properties props, String key ->
    return (props.getProperty(key) ?: "").replace('"', '')
}

ext.resolveProdObsApiKey = { Properties props ->
    def androidKey = propOrEnv(props, "OBS_API_KEY_ANDROID")
    if (!androidKey.isEmpty()) {
        return androidKey
    }
    def legacyKey = propOrEnv(props, "OBS_API_KEY")
    if (!legacyKey.isEmpty()) {
        logger.warn(
            "OBS_API_KEY en local.properties esta deprecado para prod; " +
                "usa OBS_API_KEY_ANDROID (mismo valor que el backend en prod)."
        )
        return legacyKey
    }
    return ""
}
