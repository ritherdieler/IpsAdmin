ext.loadLocalProperties = { Project project ->
    def props = new Properties()
    def file = project.rootProject.file("local.properties")
    if (file.exists()) {
        props.load(new FileInputStream(file))
    }
    return props
}

ext.propOrEnv = { Properties props, String key ->
    return (props.getProperty(key) ?: System.getenv(key) ?: "").replace('"', '')
}

ext.propOnly = { Properties props, String key ->
    return (props.getProperty(key) ?: "").replace('"', '')
}
